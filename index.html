</style><body><header><div><h1>ИСКРА</h1><small>Ещё одно улучшение.</small></div><span class="badge" id="headerStars"></span></header><div class="layout"><section class="sparkpanel"><small>ЭНЕРГИЯ</small><div id="balance">0</div><div id="persec"></div><button id="spark" aria-label="Получить энергию">+1</button><div id="buff"></div><div id="goal"></div><div class="bar"><i id="goalbar"></i></div><div class="substats"><div><b id="clickstat"></b><small>за нажатие</small></div><div><b id="achstat"></b><small>достижений</small></div><div><b id="globalstat"></b><small>множитель</small></div></div></section><main><div class="tabs" id="tabs"></div><div id="offline" class="notice"></div><div id="content"></div></main></div><footer><button id="export">Скачать сохранение</button><button id="import">Загрузить сохранение</button><button id="help">Как играть</button><button id="wipe">Новая игра</button><input id="file" type="file" accept=".json" hidden><small>Автосохранение · без рекламы и реальных покупок</small></footer><button id="bonus" hidden>Вспышка<br>поймай!</button><div id="toast" role="status"></div><dialog id="modal"></dialog><script>
(()=>{'use strict';const $=s=>document.querySelector(s),KEY='spark-career-v2',CAP=1e280;
const B=[['Огонёк',15,.1,'#987ba8','·'],['Поток',120,1,'#708eaa','≈'],['Рой',1100,8,'#789d8e','∴'],['Узел',12500,52,'#b29667','◇'],['Пульсар',160000,350,'#aa758c','✧'],['Созвездие',2400000,2600,'#8097bc','⁙'],['Галактика',42000000,21000,'#9b83b9','◎'],['Бесконечность',800000000,180000,'#b9a17b','∞']];
let s,tab='production',mode=1,toastTimer,confirmFn,wasHidden=document.hidden,last=Date.now(),saveElapsed=0,paintElapsed=0;
function fresh(){return{v:2,points:0,run:0,total:0,clicks:0,clickEarned:0,owned:B.map(()=>0),upgrades:[],ach:[],stars:0,lifetimeStars:0,prestiges:0,talents:[0,0,0],research:[0,0,0],researchSpent:0,active:0,played:0,bonusCaught:0,eventAt:45,eventUntil:0,buffUntil:0,buffKind:null,log:[],saved:Date.now()}}
function valid(x){return x&&x.v===2&&['points','run','total','clicks','clickEarned','stars','lifetimeStars','prestiges','researchSpent','active','played','bonusCaught','eventAt','eventUntil','buffUntil','saved'].every(k=>Number.isFinite(x[k])&&x[k]>=0&&x[k]<=CAP)&&['owned','talents','research'].every(k=>Array.isArray(x[k])&&x[k].length===(k==='owned'?8:3)&&x[k].every(n=>Number.isInteger(n)&&n>=0&&n<=10000))&&Array.isArray(x.upgrades)&&x.upgrades.every(k=>typeof k==='string')&&Array.isArray(x.ach)&&x.ach.every(k=>typeof k==='string')&&Array.isArray(x.log)&&x.log.length<=20&&x.log.every(v=>typeof v==='string')&&['click','flow',null].includes(x.buffKind)}
try{s=JSON.parse(localStorage.getItem(KEY));if(!valid(s))s=fresh()}catch{s=fresh()}
const fmt=n=>n>0&&n<10?n.toLocaleString('ru-RU',{maximumFractionDigits:n<1?2:1}):n<1000?Math.floor(n).toLocaleString('ru-RU'):n<1e6?(n/1e3).toFixed(1)+' тыс.':n<1e9?(n/1e6).toFixed(2)+' млн':n<1e12?(n/1e9).toFixed(2)+' млрд':n<1e15?(n/1e12).toFixed(2)+' трлн':n.toExponential(2),escape=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function log(t){s.log.unshift(t);s.log=s.log.slice(0,20)}function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').style.display='none',4500)}function save(){s.saved=Date.now();try{localStorage.setItem(KEY,JSON.stringify(s))}catch{toast('Автосохранение недоступно. Скачай резервную копию внизу.')}}
function globalMult(){return(1+s.ach.length*.01)*(1+s.lifetimeStars*.10)*(1+s.research[0]*.1)}
function tierMult(i){let n=0;for(let t of [10,25,50,100])if(s.upgrades.includes('b'+i+'x'+t))n++;return 2**n}
function baseRate(){return B.reduce((v,b,i)=>v+b[2]*s.owned[i]*tierMult(i),0)*globalMult()*(1+s.talents[0]*.1)}
function rate(){return baseRate()*(s.buffUntil>s.active&&s.buffKind==='flow'?3:1)}
function clickPower(){return((1+s.upgrades.filter(x=>x.startsWith('click')).length)*globalMult()*(1+s.talents[1]*.25)+baseRate()*.005*s.research[1])*(s.buffUntil>s.active&&s.buffKind==='click'?5:1)}
function price(i,n=s.owned[i]){return Math.ceil(B[i][1]*1.15**n)}function gain(n,manual=false){if(!Number.isFinite(n)||n<=0)return;let v=Math.min(n,CAP-s.points);s.points+=v;s.run=Math.min(CAP,s.run+v);s.total=Math.min(CAP,s.total+v);if(manual)s.clickEarned=Math.min(CAP,s.clickEarned+v)}
function visible(i){return i<2||s.owned[i]>0||s.run>=B[i][1]*.25}function countBuildings(){return s.owned.reduce((a,b)=>a+b,0)}
function achievements(){let a=[['first','Первая искра',s.clicks>=1],['click100','Ручная работа',s.clicks>=100],['click1000','Упорство',s.clicks>=1000],['manual10k','Своими руками',s.clickEarned>=10000],['buy1','Начало потока',countBuildings()>=1],['buy50','Маленькая система',countBuildings()>=50],['buy200','Всё связано',countBuildings()>=200],['bonus1','Повезло',s.bonusCaught>=1],['bonus20','Ловец вспышек',s.bonusCaught>=20],['run1k','Первая тысяча',s.run>=1000],['total1m','Миллион искр',s.total>=1e6],['total1b','Большие числа',s.total>=1e9],['hour','Долгая история',s.played>=3600],['prestige','Второе начало',s.prestiges>0]];B.forEach((b,i)=>{a.push(['own'+i+'10',b[0]+' ×10',s.owned[i]>=10]);a.push(['own'+i+'50',b[0]+' ×50',s.owned[i]>=50])});return a}
function checkAch(){let changed=false;for(let[id,name,done]of achievements())if(done&&!s.ach.includes(id)){s.ach.push(id);log('Достижение: '+name+' · +1% ко всему доходу');toast('Достижение: '+name+' · +1% к доходу');changed=true}return changed}
function upgradeDefs(){let list=[];B.forEach((b,i)=>[10,25,50,100].forEach((t,k)=>list.push({id:'b'+i+'x'+t,name:b[0]+': '+['Слаженность','Резонанс','Совершенство','Предел'][k],desc:'Производство «'+b[0]+'» ×2',cost:b[1]*[12,70,450,3500][k],ready:s.owned[i]>=t,require:t+' × '+b[0]})));[100,1000,10000,100000,1000000].forEach((n,i)=>list.push({id:'click'+i,name:['Уверенный клик','Точный ритм','Заряженное касание','Сила привычки','Абсолютный клик'][i],desc:'+1 к базовой силе клика до множителей',cost:n*.65,ready:s.clickEarned>=n,require:fmt(n)+' энергии кликами'}));return list}
function buy(i){if(!visible(i))return;let limit=mode==='max'?1000:mode,n=0;while(n<limit&&s.owned[i]<10000){let c=price(i);if(c>s.points||!Number.isFinite(c))break;s.points-=c;s.owned[i]++;n++}if(n){checkAch();save();renderContent();renderStats()}}
function buyUpgrade(id){let u=upgradeDefs().find(u=>u.id===id);if(!u||!u.ready||s.upgrades.includes(id)||s.points<u.cost)return;s.points-=u.cost;s.upgrades.push(id);log('Улучшение: '+u.name);save();renderContent();renderStats()}
function researchTokens(){return Math.max(0,Math.floor(Math.log10(Math.max(1,s.run)))-4-s.researchSpent)}
function buyResearch(i){let caps=[10,10,3],c=[100000,160000,300000][i]*2**s.research[i];if(s.run<100000||s.research[i]>=caps[i]||researchTokens()<1||s.points<c)return;s.points-=c;s.research[i]++;s.researchSpent++;log('Исследование: '+['Усиление системы','Клик и поток','Энергия в запасе'][i]);save();renderContent();renderStats()}
function prestigeReward(){return Math.floor(Math.cbrt(s.run/1e7))}function talentCost(i){return s.talents[i]+1}function buyTalent(i){let c=talentCost(i);if(s.stars<c||s.talents[i]>=10)return;s.stars-=c;s.talents[i]++;save();renderContent();renderStats()}
function prestige(){let reward=prestigeReward();if(reward<1)return;let keep={total:s.total,clicks:s.clicks,clickEarned:s.clickEarned,ach:s.ach.slice(),stars:s.stars+reward,lifetimeStars:s.lifetimeStars+reward,prestiges:s.prestiges+1,talents:s.talents.slice(),played:s.played,bonusCaught:s.bonusCaught,log:s.log.slice()};s=Object.assign(fresh(),keep);log('Новый цикл: +'+reward+' звёзд');checkAch();save();renderAll();toast('Новый цикл! Постоянные бонусы сохранены.')}
function claimBonus(){if(s.eventUntil<=s.active)return;s.eventUntil=0;s.bonusCaught++;let kind=s.bonusCaught%3;if(kind===1){let reward=Math.max(13,baseRate()*45);gain(reward);toast('Удачная вспышка: +'+fmt(reward)+' энергии')}else{s.buffKind=kind===2?'flow':'click';s.buffUntil=s.active+(kind===2?45:25);toast(kind===2?'Вдохновение: производство ×3 на 45 секунд':'Точное касание: сила клика ×5 на 25 секунд')}checkAch();save();renderContent();renderStats()}
function advance(dt,active){let capped=Math.max(0,Math.min(28800,dt));if(!active){gain(baseRate()*capped*(.25+.25*Math.min(3,s.research[2])));return}let remainingBuff=Math.max(0,s.buffUntil-s.active),boost=Math.min(capped,remainingBuff);gain(baseRate()*(s.buffKind==='flow'?boost*3+capped-boost:capped));s.active+=capped;s.played+=capped;if(s.active>=s.eventAt){s.eventUntil=s.active+20;s.eventAt=s.active+95+Math.random()*65}checkAch()}
function click(){gain(clickPower(),true);s.clicks++;checkAch();renderStats();if(tab==='upgrades'||tab==='achievements')renderContent()}
function renderTabs(){let t=[['production','Производство'],['upgrades','Улучшения'],['achievements','Достижения'],['stats','Статистика']];if(s.total>=100000||s.prestiges)t.splice(2,0,['research','Исследования']);if(s.total>=1e6||s.prestiges)t.push(['prestige','Новый цикл']);$('#tabs').innerHTML=t.map(([k,n])=>'<button data-tab="'+k+'" class="'+(tab===k?'active':'')+'">'+n+'</button>').join('')}
function researchCost(i){return[100000,160000,300000][i]*2**s.research[i]}
function renderContent(){renderTabs();let html='';if(tab==='production'){html='<div class="title"><div><h2>Пусть растёт.</h2><small>Покупать ещё один или копить на новый источник?</small></div><div class="modes">'+[1,10,'max'].map(n=>'<button class="mode '+(mode===n?'active':'')+'" data-mode="'+n+'">'+(n==='max'?'Макс.':'×'+n)+'</button>').join('')+'</div></div>'+B.map((b,i)=>visible(i)?'<article class="building"><div class="sigil" style="--c:'+b[3]+'">'+b[4]+'</div><div><h3>'+b[0]+' <small style="display:inline">×'+s.owned[i]+'</small></h3><small>'+fmt(b[2]*tierMult(i)*globalMult()*(1+s.talents[0]*.1))+' / сек. каждый</small><div class="dots" style="--c:'+b[3]+'">'+Array.from({length:Math.min(40,s.owned[i])},()=>'<i></i>').join('')+'</div></div><button data-buy="'+i+'">'+fmt(price(i))+'<small>'+ (mode===1?'за следующий':'за первый из покупки')+'</small></button></article>':(i===0||visible(i-1)?'<article class="building locked"><div class="sigil" style="--c:#4b4259">?</div><div><h3>Новый источник</h3><small>Откроется при '+fmt(b[1]*.25)+' за цикл</small></div></article>':'')).join('')+'<details><summary>Как работают покупки и улучшения?</summary>Цена каждого следующего источника увеличивается на 15%. На отметках 10, 25, 50 и 100 открывается отдельное улучшение, которое удваивает производство этого типа. Кнопки ×10 и «Макс.» покупают столько, на сколько хватает энергии.</details>'}
if(tab==='upgrades'){let list=upgradeDefs().filter(u=>u.ready&&!s.upgrades.includes(u.id));html='<h2>Покупка, которая ощущается.</h2><p>Новые улучшения открываются за количество источников и энергию, заработанную кликами.</p>'+(list.length?'<div class="grid">'+list.map(u=>'<article class="card"><h3>'+u.name+'</h3><p>'+u.desc+'</p><small>Открыто: '+u.require+'</small><br><button data-upgrade="'+u.id+'" data-cost="'+u.cost+'">Купить · '+fmt(u.cost)+'</button></article>').join('')+'</div>':'<div class="empty">Пока нет доступных улучшений. Ближайшие цели — 10 источников одного типа или 100 энергии кликами.</div>')+'<p>Куплено улучшений: '+s.upgrades.length+'</p>'}
if(tab==='research'){html='<h2>Новые связи.</h2><p>По одному открытию за каждый порядок заработка, начиная со 100 тыс.: 100 тыс., 1 млн, 10 млн и дальше. Доступно открытий: <b>'+researchTokens()+'</b>.</p><div class="grid">'+[['Усиление системы','+10% к общему множителю за уровень',10],['Клик и поток','Клик дополнительно получает 0,5% базового дохода в секунду за уровень',10],['Энергия в запасе','Офлайн-доход +25 процентных пунктов за уровень (максимум 100%)',3]].map(([n,d,cap],i)=>'<article class="card"><h3>'+n+' · '+s.research[i]+'/'+cap+'</h3><p>'+d+'</p><button data-research="'+i+'" data-cost="'+researchCost(i)+'">'+fmt(researchCost(i))+' + 1 открытие</button></article>').join('')+'</div><p>Исследования сбрасываются при новом цикле. Выбирай, что полезнее в этом прохождении.</p>'}
if(tab==='achievements'){html='<h2>Маленькие поводы продолжать.</h2><p>Каждое достижение навсегда даёт +1% ко всему доходу. Бонусы сохраняются после нового цикла.</p><div class="grid">'+achievements().map(([id,n])=>'<div class="ach '+(s.ach.includes(id)?'done':'')+'">'+(s.ach.includes(id)?'✓ ':'○ ')+n+'</div>').join('')+'</div>'}
if(tab==='stats'){html='<h2>Твой разгон.</h2><div class="statsgrid">'+[['За этот цикл',fmt(s.run)],['За всё время',fmt(s.total)],['Нажатий',fmt(s.clicks)],['Базовый доход',fmt(baseRate())+'/с'],['Куплено источников',fmt(countBuildings())],['Поймано вспышек',s.bonusCaught],['Активное время',Math.floor(s.played/60)+' мин.'],['Новых циклов',s.prestiges],['Офлайн-доход',Math.round((.25+.25*s.research[2])*100)+'%']].map(([n,v])=>'<div class="card"><b>'+v+'</b><small>'+n+'</small></div>').join('')+'</div><h3>Последние события</h3><div id="log">'+s.log.map(escape).join('<br>')+'</div>'}
if(tab==='prestige'){let r=prestigeReward(),next=1e7*(r+1)**3;html='<h2>Следующий раз — сильнее.</h2><p>Каждая полученная за всё время звезда навсегда даёт +10% к доходу. Доступные звёзды можно потратить на таланты, не теряя этот бонус.</p><div class="card"><h3>Сейчас: +'+r+' ★ за новый цикл</h3><p>Следующая звезда при '+fmt(next)+' энергии за цикл. Сбросятся энергия, источники, обычные улучшения и исследования. Достижения, звёзды и таланты останутся.</p><button id="doPrestige" class="primary" '+(r<1?'disabled':'')+'>Начать новый цикл · +'+r+' ★</button></div><h3 style="margin-top:25px">Постоянные таланты · '+s.stars+' ★ доступно</h3><div class="grid">'+[['Устойчивость','+10% к производству за уровень'],['Прикосновение','+25% к ручной части клика за уровень'],['Терпение','+1 час к лимиту офлайн-дохода за уровень (база 8 часов)']].map(([n,d],i)=>'<article class="card"><h3>'+n+' · '+s.talents[i]+'/10</h3><p>'+d+'</p><button data-talent="'+i+'">'+talentCost(i)+' ★</button></article>').join('')+'</div>'}
$('#content').innerHTML=html;renderStats()}
function renderStats(){$('#balance').textContent=fmt(s.points);$('#persec').textContent=fmt(rate())+' энергии в секунду';$('#clickstat').textContent=fmt(clickPower());$('#achstat').textContent=s.ach.length;$('#globalstat').textContent='×'+globalMult().toFixed(2);$('#headerStars').textContent=s.lifetimeStars?'★ '+s.lifetimeStars+' · постоянный бонус +'+s.lifetimeStars*10+'%':'Путь начинается с одной искры';$('#spark').textContent='+'+fmt(clickPower());let activeBuff=s.buffUntil>s.active;$('#buff').textContent=activeBuff?(s.buffKind==='flow'?'Производство ×3':'Клик ×5')+' · '+Math.ceil(s.buffUntil-s.active)+' сек.':'';let candidate=upgradeDefs().filter(u=>!s.upgrades.includes(u.id)&&!u.ready).find(u=>u.id.startsWith('b')&&s.owned[+u.id[1]]>0),match=candidate?.id.match(/b(\d)x(\d+)/),goal=match?Number(match[2]):100,progress=match?s.owned[+match[1]]:s.clickEarned;$('#goal').textContent=match?'Следующая ступень: '+B[+match[1]][0]+' '+progress+'/'+goal+' → улучшение ×2':'Заработай '+fmt(goal)+' кликами → новое улучшение';$('#goalbar').style.width=Math.min(100,progress/goal*100)+'%';$('#bonus').hidden=s.eventUntil<=s.active;document.querySelectorAll('[data-buy]').forEach(b=>b.disabled=price(+b.dataset.buy)>s.points);document.querySelectorAll('[data-cost]').forEach(b=>b.disabled=+b.dataset.cost>s.points);document.querySelectorAll('[data-research]').forEach(b=>{let i=+b.dataset.research;b.disabled=researchTokens()<1||s.research[i]>=[10,10,3][i]||s.points<researchCost(i)});document.querySelectorAll('[data-talent]').forEach(b=>b.disabled=s.stars<talentCost(+b.dataset.talent)||s.talents[+b.dataset.talent]>=10)}
function renderAll(){renderTabs();renderContent();renderStats()}function confirm(title,text,fn){confirmFn=fn;$('#modal').innerHTML='<h2>'+title+'</h2><p>'+text+'</p><div class="row"><button id="confirm" class="primary">Подтвердить</button><button id="cancel">Отмена</button></div>';$('#modal').showModal()}
$('#modal').onclick=e=>{if(e.target.id==='confirm'){let fn=confirmFn;confirmFn=null;$('#modal').close();fn?.()}if(e.target.id==='cancel')$('#modal').close()};$('#spark').onclick=click;$('#bonus').onclick=claimBonus;
$('#tabs').onclick=e=>{if(e.target.dataset.tab){tab=e.target.dataset.tab;renderContent()}};$('#content').onclick=e=>{let b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.buy!==undefined)buy(+b.dataset.buy);if(b.dataset.upgrade)buyUpgrade(b.dataset.upgrade);if(b.dataset.research!==undefined)buyResearch(+b.dataset.research);if(b.dataset.talent!==undefined)buyTalent(+b.dataset.talent);if(b.dataset.mode){mode=b.dataset.mode==='max'?'max':+b.dataset.mode;renderContent()}if(b.id==='doPrestige')confirm('Новый цикл?','Ты получишь '+prestigeReward()+' ★. Обычный прогресс сбросится. Постоянные бонусы останутся.',prestige)};
$('#export').onclick=()=>{save();let url=URL.createObjectURL(new Blob([JSON.stringify(s)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='spark-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('#import').onclick=()=>$('#file').click();$('#file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{if(f.size>100000)throw Error();let x=JSON.parse(await f.text());if(!valid(x))throw Error();confirm('Загрузить прогресс?','Текущее сохранение в этом браузере будет заменено.',()=>{s=x;s.saved=Date.now();last=Date.now();save();tab='production';renderAll();toast('Сохранение загружено')})}catch{toast('Файл не подходит. Текущий прогресс не изменён.')}e.target.value=''};$('#wipe').onclick=()=>confirm('Начать с нуля?','Все звёзды, достижения и энергия будут удалены. Скачай сохранение, если хочешь оставить копию.',()=>{s=fresh();save();tab='production';last=Date.now();renderAll()});$('#help').onclick=()=>{confirm('Неспешная прогрессия.','Нажимай на искру и покупай источники. На 10, 25, 50 и 100 источниках открываются удвоения во вкладке «Улучшения». Золотые вспышки дают временные бонусы. Исследования появятся после 100 тысяч энергии; первый новый цикл со звёздами доступен с 10 миллионов. Офлайн-доход начинается с 25% базового производства и ограничен 8 часами; его можно улучшать. Таймеры вспышек идут только в открытой видимой игре. Сохранение хранится в этом браузере — экспортируй для переноса.',()=>{})};
function offline(seconds){let cap=(8+s.talents[2])*3600,dt=Math.min(cap,Math.max(0,seconds)),n=baseRate()*dt*(.25+.25*Math.min(3,s.research[2]));gain(n);if(dt>60&&n>0){$('#offline').style.display='block';$('#offline').textContent='За время отсутствия: +'+fmt(n)+' энергии ('+Math.floor(dt/60)+' мин., '+Math.round((.25+.25*s.research[2])*100)+'% базового производства).'}checkAch()}
offline((Date.now()-s.saved)/1000);renderAll();save();let unlockSignature='';setInterval(()=>{let now=Date.now(),dt=Math.max(0,(now-last)/1000);last=now;if(!document.hidden&&!wasHidden)advance(Math.min(5,dt),true);saveElapsed+=dt;paintElapsed+=dt;if(!document.hidden){let sig=[s.ach.length,...s.owned.map((_,i)=>visible(i)?1:0),s.total>=100000,s.total>=1e6].join();if(sig!==unlockSignature||paintElapsed>3){unlockSignature=sig;paintElapsed=0;renderContent()}else renderStats()}if(saveElapsed>=5&&!document.hidden){saveElapsed=0;save()}},250);document.addEventListener('visibilitychange',()=>{let now=Date.now();if(document.hidden){s.saved=now;save();wasHidden=true}else{offline((now-s.saved)/1000);wasHidden=false;last=now;save();renderAll()}});addEventListener('pagehide',()=>{if(wasHidden)offline((Date.now()-s.saved)/1000);save()});
})();
</script></body></html>
