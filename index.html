function modal(title,html,buttons){$('#modal').innerHTML='<div class="overline">SECOND LIFE / WORKSHOP</div><h2>'+title+'</h2>'+html+'<div class="modalactions">'+buttons.map(b=>'<button class="'+(b.primary?'primary':'')+'" data-action="'+b.action+'">'+b.text+'</button>').join('')+'</div>';$('#modal').showModal()}
function clock(){let t=9*60+S.time;return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function spend(minutes){if(S.time+minutes>MAXTIME){toast('Not enough time today. Close the day; active repairs will stay on your bench.');return false}S.time+=minutes;return true}
function ledger(text,amount){S.cash+=amount;S.ledger.unshift({day:S.day,text,amount});S.ledger=S.ledger.slice(0,100);if(amount<0)S.expenses-=amount;save()}
function addLog(j,text){j.logs.unshift({time:clock(),text});j.logs=j.logs.slice(0,20)}
function makeJob(force){let maxTier=Math.min(4,level()),keys=Object.keys(FAULTS).filter(k=>FAULTS[k].tier<=maxTier);let fault=force||keys[Math.floor(Math.random()*keys.length)],f=FAULTS[fault],p=Math.floor(Math.random()*PEOPLE.length),person=PEOPLE[p],returning=S.stories[p]||0,id=S.nextId++;let base=(f.part?PARTS[f.part].cost:0)+f.labor;return{id,fault,person:p,model:f.model[Math.floor(Math.random()*f.model.length)],received:S.day,due:S.day+(person.priority==='speed'?1:2),status:'new',tests:{},asked:[],consent:false,testsPassed:[],dialog:[{who:'client',text:(returning?'Hi again. You helped me '+returning+' time'+(returning===1?'':'s')+' before. ':'')+f.symptom+' '+person.intro+(returning?' '+ARCS[p][Math.min(2,returning-1)]:'')}],diagnosis:null,quote:0,quality:100,step:0,screws:[],wires:[],installed:false,repairs:0,logs:[],budget:Math.round(base*person.budget+(id%3)*8),late:false,returning}}
function generate(){let n=Math.min(6,3+Math.floor(level()/2));S.incoming=Array.from({length:n},(_,i)=>makeJob(S.day===1&&i===0?'phonePort':undefined));if(S.day===1){S.incoming[0].person=2;S.incoming[0].model='Nova Mini';S.incoming[0].due=S.day+2;S.incoming[0].budget=42;S.incoming[0].dialog=[{who:'client',text:'Hello! My phone cable keeps falling out. Another cable does the same. I would love to repair it instead of replacing it.'}]}}
if(!S.incoming.length&&!S.orders.length&&!S.history.length)generate();

ath d="M28 101l47-51" stroke="#b5d1a0" stroke-width="1"/><rect x="37" y="12" width="26" height="5" rx="3" fill="#102329"/><circle cx="50" cy="137" r="3" fill="#889f90"/></svg>'}
let screws=[['tl',32,22],['tr',288,22],['bl',32,282],['br',288,282]],wireLabels=['A','B','C'];let working=j?.status==='approved',step=j?.step||0;let components=[['battery','BATTERY',55,90,92,125,'#657960'],['screen','DISPLAY',58,43,205,30,'#617b80'],['port','PORT',134,242,58,20,'#a1a389'],['fan','COOLING',177,90,83,81,'#708b83'],['board','LOGIC BOARD',163,183,104,55,'#446c5e'],['stick','INPUT',62,228,51,32,'#6d7d77'],['paste','THERMAL',206,106,26,26,'#b8baa3'],['clean','CONTACTS',203,247,60,14,'#c3a776']];return'<svg class="benchsvg" viewBox="0 0 320 310" role="img" aria-label="Interactive '+device+' service board"><defs><pattern id="trace" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 12h12V0m0 24v-7h12" fill="none" stroke="#7ba390" stroke-opacity=".2"/></pattern></defs><rect x="20" y="10" width="280" height="286" rx="20" fill="#a7b4a2"/><rect x="27" y="17" width="266" height="272" rx="15" fill="#24473f"/><rect x="30" y="20" width="260" height="265" fill="url(#trace)"/>'+components.map(([id,label,x,y,w,h,c])=>'<g tabindex="0" role="button" aria-label="'+label+'" data-component="'+id+'"><rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="5" fill="'+c+'" stroke="#bbcab066" class="'+(working&&step===2&&FAULTS[j.diagnosis]?.part===id?'glow':'')+'"/><text x="'+(x+w/2)+'" y="'+(id==='fan'?y+14:y+h/2+3)+'" text-anchor="middle" fill="#e2e8d5" font-size="'+(h<20?7:9)+'" font-family="monospace">'+label+'</text></g>').join('')+screws.map(([id,x,y])=>'<g data-screw="'+id+'" tabindex="0" role="button" aria-label="Screw '+id+'"><circle cx="'+x+'" cy="'+y+'" r="7" fill="'+(j?.screws.includes(id)?'#182d2b':'#b9c1ad')+'"/><path d="M'+(x-3)+' '+y+'h6m-3-3v6" stroke="#566c62"/></g>').join('')+'<g data-component="isolate" tabindex="0" role="button" aria-label="Battery connector"><rect x="143" y="139" width="22" height="17" fill="'+(step>=2?'#b7996d':'#d0d7c1')+'" class="'+(working&&step===1?'glow':'')+'"/><text x="154" y="134" font-size="7" text-anchor="middl function nav(label,id,count){return'<button data-view="'+id+'" class="'+(view===id?'active':'')+'">'+label+(count!==undefined?'<span class="navcount">'+count+'</span>':'')+'</button>'}
function render(){let j=job();if(view==='bench'&&!j)view='desk';$('#app').innerHTML='<header><div class="brand"><div class="logo" style="font-size:15px;font-weight:650">SL</div><div><strong>SECOND LIFE</strong><div class="overline" style="margin:3px 0 0">A repair shop of your own</div></div></div><div class="stats"><div class="stat"><small>WORKING DAY '+S.day+'</small><b>'+clock()+' <span class="subtle">/ 17:00</span></b></div><div class="stat"><small>AVAILABLE FUNDS</small><b class="money">'+money(S.cash)+'</b></div><div class="stat"><small>REPUTATION</small><b>'+S.rep+' <span class="subtle">/ 100</span></b></div><button class="small" data-action="endday">Close day ↗</button></div></header><div class="layout"><aside>'+nav('Front desk','desk',S.incoming.length)+nav('Active repairs','orders',S.orders.length)+nav('Parts & suppliers','shop')+nav('Workshop upgrades','upgrades')+nav('Career & journal','career')+nav('How to play','help')+'<div class="sidebottom"><div class="overline">LEVEL '+level()+' · '+['','New technician','Local specialist','Trusted workshop','Board technician','Senior technician','Repair expert','Master technician','Neighbourhood institution'][level()]+'</div><div class="progress"><i style="width:'+(level()===8?100:(S.xp%140)/140*100)+'%"></i></div><p class="subtle">'+S.xp+' career XP · '+S.completed+' repairs</p><div class="sidegoal">'+goal()+'</div><div class="saveflash">Saved locally · export backups in Career</div></div></aside><main>'+({desk:desk,orders:orders,bench:bench,shop:shop,upgrades:upgrades,career:career,help:help}[view]||desk)()+'</main></div>';save();if(view==='bench'&&tab==='talk'){let c=$('.chat');if(c)c.scrollTop=c.scrollHeight}}
function title(h,p,extra=''){return'<div class="titlebar"><div><div class="overline">YOUR NEIGHBOURHOOD WORKSHOP</div><h1>'+h+'</h1><div class="subtle">'+p+'</div></div>'+extra+'</div>'}
function goal(){if(!S.completed)return'FIRST MILESTONE<br>Repair your first device. Ask questions, test the hardware, then agree a price.';if(!has('iron'))return'NEXT INVESTMENT<br>A soldering station opens up ports and analog-stick repairs.';if(!has('scope'))return'NEXT MILESTONE<br>Build your reputation and invest in a microscope for board repairs.';return'OPEN-ENDED CAREER<br>Build a reliable shop, maintain your reputation and meet returning customers.'}
function jobCard(j,active=false){let p=PEOPLE[j.person],f=FAULTS[j.fault];return'<article class="card"><div class="cardhead"><div class="person">'+avatar(p)+'<div><b>'+p.name+'</b><small>'+p.role+'</small></div></div><span class="tag '+(j.late?'red':'')+'">'+(active?({new:'Awaiting diagnosis',approved:'On the bench',repaired:'Final checks'}[j.status]||j.status):j.returning?'Returning client':'New enquiry')+'</span></div><div class="deviceicon">'+deviceSVG(f.device)+'</div><h3>'+j.model+' <span class="subtle">/ '+f.device+'</span></h3><p style="font-size:12px">“'+f.symptom+'”</p><div class="footer"><span class="subtle">Due day '+j.due+'</span><button class="'+(active?'':'primary')+'" data-action="'+(active?'open':'accept')+'" data-id="'+j.id+'">'+(active?'Open order →':'Meet client →')+'</button></div></article>'}
function desk(){return title('A little care. A second life.','Listen first. Diagnose carefully. Give people a reason to come back.')+(S.tutorial?'<div class="hero"><div><div class="overline">WELCOME TO YOUR FIRST WORKING DAY</div><h2>Every device has a story.<br>Your workshop starts here.</h2><p>Meet Iris and investigate her charging problem. You already own a multimeter and two cleaning kits. Parts are bought with in-game money; there are no real purchases.</p><button class="primary" data-action="accept" data-id="'+S.incoming[0]?.id+'">Start the first case →</button> <button class="small" data-view="help">Read the field guide</button></div><div class="deviceicon">'+deviceSVG('Phone')+'</div></div>':'')+(S.dayEvent?'<div class="notice">'+esc(S.dayEvent)+'</div>':'')+'<div class="row spread" style="margin-bottom:16px"><h2 style="margin:0">At the counter</h2><span class="subtle">'+S.orders.length+' / '+capacity()+' active slots</span></div>'+(S.incoming.length?'<div class="grid">'+S.incoming.map(j=>jobCard(j)).join('')+'</div>':'<div class="empty">No more walk-ins today. Work on your active repairs or close the day.</div>')+'<div class="item" style="margin-top:18px"><div><h3>Quick service counter</h3><p>Fit protectors, organise cables and help with settings. A small, reliable income if your workshop needs a fresh start.</p></div><button data-action="quick">30 min · earn $18</button></div>'}
function orders(){return title('Devices in your care.','Unfinished repairs and their parts stay here overnight.')+(S.orders.length?'<div class="grid">'+S.orders.map(j=>jobCard(j,true)).join('')+'</div>':'<div class="empty">Your workbench is clear. Meet a customer at the front desk.</div>')}
function bench(){let j=job(),p=PEOPLE[j.person],f=FAULTS[j.fault];return title(j.model+' / Order #'+String(j.id).padStart(3,'0'),p.name+' · Due day '+j.due+' · Condition '+j.quality+'%', '<button class="small" data-view="orders">← All repairs</button>')+(j.late?'<div class="notice">This order is overdue. Finish it to rebuild the customer’s trust.</div>':'')+'<div class="tabs">'+[['talk','01 · Conversation'],['diagnose','02 · Diagnostics'],['repair','03 · Workbench'],['finish','04 · Handover']].map(([v,label])=>'<button class="'+(tab===v?'active':'')+'" data-tab="'+v+'">'+label+'</button>').join('')+'</div><div class="workgrid"><div><div class="workmat"><div class="benchcaption"><span>SERVICE MAT / '+f.device.toUpperCase()+'</span><span>ESD · '+(j.status==='approved'?'ACTIVE':'STANDBY')+'</span></div>'+deviceSVG(f.device,true,j)+'<div class="benchcaption"><span>Condition '+j.quality+'% · Repair attempts '+j.repairs+'</span><span class="mono">SL—'+j.id+'</span></div></div><div class="worklog">'+j.logs.slice(0,7).map(l=>'<div><span>'+l.time+'</span> '+esc(l.text)+'</div>').join('')+'</div></div><section class="card">'+({talk:talkPanel,diagnose:diagPanel,repair:repairPanel,finish:finishPanel}[tab]||talkPanel)(j)+'</section></div>'}
function talkPanel(j){let p=PEOPLE[j.person];return'<div class="cardhead"><div class="person">'+avatar(p)+'<div><b>'+p.name+'</b><small>'+p.role+(j.returning?' · a familiar face':'')+'</small></div></div><span class="tag">'+p.priority+' matters</span></div><div class="chat">'+j.dialog.map(l=>'<div class="bubble '+(l.who==='you'?'you':'')+'"><small>'+ (l.who==='you'?'YOU':p.name.toUpperCase())+'</small>'+esc(l.text)+'</div>').join('')+'</div><div class="choices">'+[['history','What happened before the problem started?'],['budget','What budget and timing work for you?'],['permission','May I run diagnostics? I will not browse or erase your files.'],['care','I will agree the price with you before replacing anything.'],['promise','I can promise it will be ready today.']].filter(([k])=>!j.asked.includes(k)).map(([k,label])=>'<button data-action="ask" data-question="'+k+'">'+label+'</button>').join('')+'</div><div class="row" style="margin-top:18px"><button class="primary" data-tab="diagnose">To diagnostics →</button><button class="small danger" data-action="decline">Return without repair</button></div>'}
function diagPanel(j){let f=FAULTS[j.fault],options=Object.keys(FAULTS).filter(k=>FAULTS[k].device===f.device);return'<div class="overline">EVIDENCE BEFORE ASSUMPTIONS</div><h2>Find the actual fault.</h2><p class="subtle">Tests use workshop time. Compare the findings; a symptom alone is not a diagnosis.</p><div class="tests">'+Object.entries(TESTS).map(([k,t])=>'<button data-action="test" data-test="'+k+'" '+(j.tests[k]||!has(t.tool)||j.status!=='new'?'disabled':'')+'>'+t.name+'<small>'+ (j.tests[k]?'Completed':!has(t.tool)?'Needs '+TOOLS[t.tool].name:t.minutes+' min'+(t.consent&&!j.consent?' · permission needed':''))+'</small></button>').join('')+'</div>'+Object.entries(j.tests).map(([k,v])=>'<div class="evidence"><b>'+TESTS[k].name+'</b><br>'+v+'</div>').join('')+'<div style="margin-top:20px"><label class="subtle" for="diagnosis">Working diagnosis</label><select id="diagnosis" style="display:block;width:100%;margin:8px 0" '+(j.status!=='new'?'disabled':'')+'><option value="">Choose from the evidence…</option>'+options.map(k=>'<option value="'+k+'" '+(j.diagnosis===k?'selected':'')+'>'+FAULTS[k].name+'</option>').join('')+'</select><label class="subtle" for="quote">Total quote (parts + labour)</label><div class="row" style="margin:9px 0"><input id="quote" type="number" min="10" max="500" step="1" value="'+(j.quote||suggestQuote(j))+'" '+(j.status!=='new'?'disabled':'')+'><button class="primary" data-action="quote" '+(used(j)<2||j.status!=='new'?'disabled':'')+'>Discuss quote →</button></div><p class="subtle">'+(used(j)<2?'Run at least two tests before quoting.':j.asked.includes('budget')?'Client’s stated budget: '+money(j.budget):'Ask about budget in Conversation. Quotes are not guaranteed to be accepted.')+'</p></div>'}
function suggestQuote(j){let f=FAULTS[j.diagnosis||j.fault];return Math.round((f.part?PARTS[f.part].cost:0)+f.labor)}
function requiredTools(f){return f.tool==='scope'?['scope','iron','psu']:f.tool?[f.tool]:[]}function canService(f){return requiredTools(f).every(has)}function missingTools(f){return requiredTools(f).filter(t=>!has(t)).map(t=>TOOLS[t].name).join(', ')}
function repairPanel(j){if(j.status==='new')return'<h2>Agreement comes first.</h2><p>Gather evidence, choose a diagnosis and get the client’s approval before opening the device.</p><button class="primary" data-tab="diagnose">Run diagnostics →</button>';if(j.status==='repaired')return'<h2>Back together.</h2><p>The repair is complete. Run final checks before giving the device back.</p><button class="primary" data-tab="finish">Final checks →</button>';let f=FAULTS[j.diagnosis],tool=f.tool,part=f.part,descs=['Remove all four corner screws on the service board.','Disconnect the battery at the small POWER connector.','Select '+(part?PARTS[part].name.toLowerCase()+' / '+(part==='clean'?'CONTACTS':part==='paste'?'THERMAL':part.toUpperCase()):'LOGIC BOARD')+' on the board to service it.','Install the replacement / perform the service.','Reconnect the ribbon sockets in the service sequence: B → A → C.','Close the device and secure the housing.'];return'<div class="overline">APPROVED · '+money(j.quote)+'</div><h2>'+f.name+'</h2><div class="steps">'+descs.map((_,i)=>'<i class="'+(i<=j.step?'done':'')+'"></i>').join('')+'</div><h3>Step '+(j.step+1)+' / 6</h3><p>'+descs[j.step]+'</p><p class="subtle">Interact with labelled parts on the service mat. This is a simplified service board, not a real repair manual.</p>'+(!canService(f)?'<div class="notice">This service needs '+missingTools(f)+'. Buy it in Workshop upgrades.</div>':'')+'<div class="item" style="margin:16px 0"><div><div class="overline">PART / SUPPLY</div><b>'+(part?PARTS[part].name:'Non-destructive system recovery')+'</b><p>'+(part?(S.stock[part]||0)+' in stock · '+money(PARTS[part].cost)+' base cost':'Requires permission. Keeps customer data intact.')+'</p></div>'+(part?'<button class="small" data-view="shop">Supplier →</button>':'')+'</div>'+(j.step===3?'<button class="primary" data-action="install" '+(!canService(f)||part&&!S.stock[part]||!part&&!j.consent?'disabled':'')+'>'+(part?'Install / service · 18 min':'Recover system · 18 min')+'</button>':'')+(j.step===5?'<button class="primary" data-action="assemble">Reassemble · 10 min</button>':'')+'<p class="subtle">'+(j.step<3?'Careful handling preserves repair quality.':j.step===4?'Click the three labelled ribbon sockets on the board.':'')+'</p>'}
function finishPanel(j){if(j.status!=='repaired')return'<h2>Not ready to hand over.</h2><p>Complete the repair first, then test the result.</p><button class="primary" data-tab="repair">Return to the bench →</button>';return'<div class="overline">QUALITY CONTROL</div><h2>Trust is in the details.</h2><p class="subtle">A finished assembly is not proof of a successful repair. Run all three checks.</p><div class="choices">'+[['boot','Power & boot'],['function','Functions & controls'],['stable','Stability under load']].map(([k,label])=>'<button data-action="qc" data-check="'+k+'" '+(j.testsPassed.includes(k)?'disabled':'')+'>'+label+' · '+(j.testsPassed.includes(k)?'PASS':'8 min')+'</button>').join('')+'</div><div class="row" style="margin-top:18px"><button class="primary" data-action="handover" '+(j.testsPassed.length<3?'disabled':'')+'>Hand back · receive '+money(j.quote)+'</button><button class="small" data-action="reopen">Reopen & investigate</button></div><p class="subtle">Your quote includes all labour and parts. No hidden fees.</p>'}

function partCost(k){return Math.ceil(PARTS[k].cost*(has('catalog')?.85:1))}
function upgrades(){return title('Grow into the work.','Better equipment unlocks new jobs and more precise diagnostics.')+'<div class="grid">'+Object.entries(TOOLS).map(([k,t])=>'<article class="card"><div class="cardhead"><span class="tag '+(has(k)?'':'amber')+'">'+(has(k)?'Installed':'Level '+t.level)+'</span><span class="money">'+money(t.cost)+'</span></div><h2>'+t.name+'</h2><p style="min-height:55px;font-size:12px">'+t.desc+'</p><button data-action="upgrade" data-tool="'+k+'" '+(has(k)||level()<t.level||S.cash<t.cost?'disabled':'')+'>'+(has(k)?'Owned':level()<t.level?'Reach level '+t.level:'Invest in workshop')+'</button></article>').join('')+'</div>'}
function career(){let milestones=[['First second life',S.completed>=1,'Complete a successful repair.'],['Known on this street',S.completed>=10,'Return 10 devices to their owners.'],['Careful hands',S.stats.perfect>=5,'Complete 5 repairs at 95%+ condition.'],['A listening ear',S.stats.questions>=20,'Ask 20 customer questions.'],['A proper workshop',has('scope')&&has('iron'),'Own a microscope and soldering station.'],['A hundred second lives',S.completed>=100,'Build a career with 100 completed repairs.']];return title('A shop with a history.','Your career continues across working days. Export a backup before changing browser or device.')+'<div class="journal"><div class="card"><b>'+S.completed+'</b><span class="subtle">Devices repaired</span></div><div class="card"><b>'+money(S.totalEarned)+'</b><span class="subtle">Total revenue</span></div><div class="card"><b>'+level()+'</b><span class="subtle">Career level · '+S.xp+' XP</span></div><div class="card"><b>'+S.day+'</b><span class="subtle">Working days</span></div></div><div class="row"><button data-action="export">Export save</button><label><input type="file" id="importfile" accept="application/json,.json" hidden><button data-action="import">Import save</button></label><button class="small danger" data-action="reset">New career</button></div><div class="grid" style="margin-top:22px"><section class="card"><h2>Milestones</h2>'+milestones.map(([n,d,t])=>'<div class="goal '+(d?'done':'')+'"><b>'+(d?'✓ ':'○ ')+n+'</b><p class="subtle">'+t+'</p></div>').join('')+'</section><section class="card"><h2>People remember.</h2>'+Object.entries(S.stories).map(([k,n])=>'<div class="item" style="margin-bottom:8px"><div class="person">'+avatar(PEOPLE[k])+'<div>'+PEOPLE[k].name+'<p>'+n+' successful visit'+(n===1?'':'s')+'</p></div></div></div>').join('')+(Object.keys(S.stories).length?'':'<p>Your first regular customers are still out there.</p>')+'</section></div><section class="card" style="margin-top:20px"><h2>Workshop ledger</h2><table class="ledger"><thead><tr><th>Day</th><th>Entry</th><th>Amount</th></tr></thead><tbody>'+S.ledger.slice(0,25).map(l=>'<tr><td>'+l.day+'</td><td>'+esc(l.text)+'</td><td class="'+(l.amount>=0?'money':'')+'">'+(l.amount>0?'+':'')+money(l.amount)+'</td></tr>').join('')+'</tbody></table></section><section class="card" style="margin-top:20px"><h2>Recent repairs</h2>'+S.history.slice(0,15).map(h=>'<div class="item" style="margin:8px 0"><div><b>'+esc(h.person)+' · '+esc(h.model)+'</b><p>'+esc(h.fault)+' · Day '+h.day+' · '+h.quality+'% condition</p></div><span class="tag '+(h.ok?'':'red')+'">'+(h.ok?'Returned':'Unrepaired')+'</span></div>').join('')+'</section>'}
function help(){return title('A repair is more than a replacement.','The workshop runs only when you take actions. No waiting while the browser is closed.')+'<div class="grid">'+[['01 · Meet the person','Accept a walk-in. Ask about the history, budget and priorities. Get permission before system diagnostics or recovery. Returning customers remember previous successful visits.'],['02 · Follow the evidence','Run at least two tests. Look at the actual measurements, not only the complaint. Choose a working diagnosis and propose a total quote. A wrong diagnosis can consume parts without solving the problem.'],['03 · Repair by hand','After approval, remove four screws on the service mat. Disconnect POWER, select the relevant component, install a compatible part, reconnect B → A → C and reassemble. The board is intentionally simplified; it is not a real-world repair guide.'],['04 · Prove it works','Run power, function and stability checks. If a test fails, reopen the job, investigate and discuss a revised repair without charging twice. Return a working device for money, XP and reputation.'],['05 · Manage a working day','Each action uses minutes from 09:00 to 17:00. Close the day to receive standard deliveries and new enquiries. Repairs carry over. Daily overhead is $18; overdue orders lose trust. Express parts arrive immediately but cost more and use 15 minutes.'],['06 · Build a career','Higher levels bring laptops, controllers, consoles and board repairs. Buy tools to handle complex jobs. If cash is tight, the quick-service counter earns $18 for 30 minutes. There is no bankruptcy lockout or forced ending.'],['07 · Keep your progress','The game saves locally after actions. Use Career → Export save to move your workshop to another browser or computer. Your save belongs to this browser and website address. No account, connection or payment is required to play.'],['Performance','This game uses HTML and small SVG illustrations. No 3D engine, downloads, video or continuous animation. It is designed to be light on entry-level laptops; actual performance depends on the browser and device.']].map(([h,p])=>'<section class="card"><h2>'+h+'</h2><p>'+p+'</p></section>').join('')+'</div>'}
function ask(j,q){if(j.asked.includes(q))return;let f=FAULTS[j.fault],p=PEOPLE[j.person];let texts={history:['What happened before the problem started?',f.accident],budget:['What budget and timing work for you?','I can spend up to '+money(j.budget)+'. '+(p.priority==='speed'?'I need it by tomorrow.':'Day '+j.due+' is fine if we agree the work first.')],permission:['May I run diagnostics? I will not browse or erase your files.','Yes. Hardware diagnostics and a non-destructive recovery are fine. Please keep my files private.'],promise:['I can promise it will be ready today.','That would really help. I will come back before you close today.'],care:['I will agree the price with you before replacing anything.','Thank you. '+(j.returning?'That is why I came back.':'I appreciate knowing what I am paying for.')]};if(!texts[q])return;if(!spend(3))return;if(q==='promise'){j.due=S.day;j.promised=true}j.asked.push(q);S.stats.questions++;if(q==='permission')j.consent=true;j.dialog.push({who:'you',text:texts[q][0]},{who:'client',text:texts[q][1]});addLog(j,'Discussed '+q+' with '+p.name);render()}
function test(j,k){let t=TESTS[k];if(!t||j.tests[k]||j.status!=='new')return;if(!has(t.tool)){toast('This test needs '+TOOLS[t.tool].name);return}if(t.consent&&!j.consent){toast('Ask the client for diagnostic permission in Conversation first.');return}if(!spend(t.minutes))return;let f=FAULTS[j.fault];j.tests[k]=f.results[k]||({visual:'Housing and connectors show no visible damage.',power:'Voltage and power rails are within specification.',charge:'No abnormal input resistance or charging interruption.',stress:'No thermal or load-related faults observed.',input:'This input test shows no additional fault.',system:'No software fault detected.',current:'Current draw is within specification.',thermal:'No abnormal localised hot spots.'}[k]);addLog(j,t.name+': '+j.tests[k]);render()}
function propose(j){let d=$('#diagnosis').value,q=Number($('#quote').value);if(!FAULTS[d]||FAULTS[d].device!==FAULTS[j.fault].device){toast('Choose a diagnosis from your test findings.');return}if(!Number.isInteger(q)||q<10||q>500){toast('Enter a total quote between $10 and $500.');return}if(used(j)<2||j.status!=='new')return;if(!spend(5))return;j.diagnosis=d;let p=PEOPLE[j.person];j.dialog.push({who:'you',text:'My working diagnosis is '+FAULTS[d].name.toLowerCase()+'. The total including parts and labour is '+money(q)+'.'});if(q>j.budget){j.dialog.push({who:'client',text:'That is above my budget. I can go up to '+money(j.budget)+'. Can we discuss it again?'});toast('Quote declined. Ask about budget or revise the price.');tab='talk';render();return}j.quote=q;j.status='approved';j.step=0;j.screws=[];j.wires=[];j.dialog.push({who:'client',text:'That works for me. Please go ahead, and keep me informed.'});addLog(j,'Client approved '+money(q)+' for '+FAULTS[d].name);tab='repair';toast('Quote approved. You can begin the repair.');render()}
function repairClick(j,kind,value){if(j.status!=='approved'||tab!=='repair'){toast('Open the Workbench tab after the quote is approved.');return}if(kind==='screw'){if(j.step!==0||j.screws.includes(value))return;if(!spend(has('training')?1:3))return;j.screws.push(value);if(j.screws.length===4){j.step=1;addLog(j,'Housing opened; all screws organised.')}render();return}if(kind==='component'){if(j.step===1&&value==='isolate'){if(!spend(3))return;j.step=2;addLog(j,'Battery isolated before servicing.');render();return}if(j.step===2){let f=FAULTS[j.diagnosis],wanted=f.part||'board';if(value!==wanted){toast('Selected '+value+'. Follow the approved service plan or revisit your diagnosis.');return}if(!spend(has('training')?4:7))return;j.step=3;addLog(j,'Prepared '+(f.part?PARTS[f.part].name:'system recovery interface')+' for service.');render();return}if(j.step===1){toast('Disconnect the small POWER connector before touching components.');return}toast('Follow the current step on the right.');return}if(kind==='wire'&&j.step===4){let seq=['B','A','C'];if(j.wires.includes(value))return;if(!spend(2))return;if(value!==seq[j.wires.length]){j.quality=Math.max(60,j.quality-(has('training')?1:3));j.wires=[];addLog(j,'Connector order corrected. Reconnect B → A → C.');toast('Wrong socket order. Start again: B → A → C.')}else{j.wires.push(value);if(j.wires.length===3){j.step=5;addLog(j,'Ribbon connectors secured in the service sequence.')}}render()}}
function install(j){if(j.status!=='approved'||j.step!==3)return;let f=FAULTS[j.diagnosis];if(!canService(f)){toast('This service requires '+missingTools(f));return}if(f.part&&!S.stock[f.part]){toast('Order a '+PARTS[f.part].name+' from the supplier.');return}if(!f.part&&!j.consent){toast('Ask permission before recovering the system.');return}if(!spend(has('training')?12:18))return;if(f.part)S.stock[f.part]--;j.installed=true;j.step=4;addLog(j,f.part?'Installed / serviced '+PARTS[f.part].name+'.':'Performed non-destructive system recovery.');render()}
function assemble(j){if(j.status!=='approved'||j.step!==5||!j.installed)return;if(!spend(10))return;j.status='repaired';j.repairs++;j.fixed=j.diagnosis===j.fault;j.testsPassed=[];addLog(j,'Device reassembled. Final quality checks required.');tab='finish';render()}
function qc(j,k){if(j.status!=='repaired'||j.testsPassed.includes(k)||!['boot','function','stable'].includes(k))return;if(!spend(8))return;if(!j.fixed){addLog(j,'FAIL: '+({boot:'Original fault remains after the repair.',function:'The reported symptom is still reproducible.',stable:'Device does not pass the original fault scenario.'}[k]));toast('Check failed. The original fault is still present. Reopen the job and compare the evidence.');render();return}j.testsPassed.push(k);addLog(j,'PASS: '+({boot:'Power & boot',function:'Functions & controls',stable:'Stability under load'}[k]));render()}
function reopen(j){if(j.status!=='repaired')return;modal('Reopen this repair?','<p>Your installed parts remain in the device. A further replacement will use another part. Review the evidence and agree the revised total; no payment has been taken yet.</p>',[{text:'Reopen & diagnose',action:'confirmReopen',primary:true},{text:'Keep checking',action:'closeModal'}])}
function handover(j){if(j.status!=='repaired'||!j.fixed||j.testsPassed.length!==3)return;if(!spend(5))return;let f=FAULTS[j.fault],p=PEOPLE[j.person],xp=22+f.tier*12+(j.quality>=95?8:0),repGain=(j.late?0:3)+(j.asked.length>=3?1:0);ledger(p.name+' · '+j.model+' repair',j.quote);S.totalEarned+=j.quote;S.completed++;S.xp+=xp;S.rep=Math.min(100,S.rep+repGain);S.stats.perfect+=j.quality>=95?1:0;S.stats.diagnosed++;S.stories[j.person]=(S.stories[j.person]||0)+1;S.history.unshift({day:S.day,person:p.name,model:j.model,fault:f.name,quality:j.quality,ok:true});S.history=S.history.slice(0,150);S.orders=S.orders.filter(x=>x.id!==j.id);selected=null;view='desk';save();modal('Another device. Another second life.','<div class="bubble"><small>'+p.name.toUpperCase()+'</small>'+p.thanks+(j.late?' I wish it had been ready sooner, though.':j.promised?' And right on time, just as you promised.':'')+'</div><div class="row"><span class="tag">+'+xp+' XP</span><span class="tag">+'+repGain+' reputation</span><span class="tag">'+money(j.quote)+' received</span></div><p>Condition '+j.quality+'% · '+j.testsPassed.length+' quality checks passed · '+(j.returning?'A returning customer.':'The start of a customer relationship.')+'</p>',[{text:'Back to the workshop',action:'closeModal',primary:true}]);render()}
function endDay(){modal('Close day '+S.day+'?','<p>Unfinished repairs and parts stay in your workshop. New customers and standard deliveries arrive tomorrow.</p><p>Daily rent and utilities: <b>$18</b>. '+(S.orders.some(j=>j.due<=S.day)?'Some active orders will become overdue.':'Check due dates before closing.')+'</p>',[{text:'Close & open tomorrow',action:'confirmDay',primary:true},{text:'Keep working',action:'closeModal'}])}
function nextDay(){let earnings=S.ledger.filter(l=>l.day===S.day&&l.amount>0).reduce((s,l)=>s+l.amount,0),fee=Math.min(18,S.cash);ledger('Rent & utilities',-fee);S.day++;S.time=0;let delivered=S.deliveries.reduce((a,d)=>{S.stock[d.part]=(S.stock[d.part]||0)+d.qty;return a+d.qty},0);S.deliveries=[];for(let j of S.orders){if(S.day>j.due&&!j.late){j.late=true;S.rep=Math.max(0,S.rep-4);addLog(j,'Due date passed. Client is waiting for an update.')}}let events=['A local noticeboard mentioned the workshop. New faces are stopping by.','A quiet morning. The best advertisement is a customer who trusts you.','Repair, reuse, repeat. Your regular customers are spreading the word.'];S.dayEvent=S.day%4===0?'Community repair day: quick-service jobs pay $24 today.':events[S.day%events.length];generate();view='desk';selected=null;save();$('#modal').close();render();toast('Day '+S.day+' · yesterday’s income '+money(earnings)+' · '+delivered+' parts delivered'+(fee<18?' · remaining overhead waived for a fresh start.':''))}
function decline(){let j=job();if(!j)return;modal('Return without repair?','<p>Be honest about what you can do. No payment will be taken. Parts already used cannot be recovered. Reputation impact: '+(j.status==='new'?1:4)+' point'+(j.status==='new'?'':'s')+'.</p>',[{text:'Return the device',action:'confirmDecline'},{text:'Continue working',action:'closeModal',primary:true}])}
function accept(id){let j=S.incoming.find(x=>x.id===id);if(!j)return;if(S.orders.length>=capacity()){toast('All workbench slots are occupied. Complete or return an active repair.');return}S.incoming=S.incoming.filter(x=>x.id!==id);S.orders.push(j);selected=id;view='bench';tab='talk';S.tutorial=false;addLog(j,'Device received at the front desk.');render()}
function buy(k,speed){if(!PARTS[k])return;let cost=partCost(k),express=speed==='express';if(express)cost=Math.ceil(cost*1.35);if(S.cash<cost){toast('Not enough workshop funds.');return}if(express&&!spend(15))return;ledger(PARTS[k].name+' · '+(express?'express delivery':'standard order'),-cost);if(express)S.stock[k]=(S.stock[k]||0)+1;else S.deliveries.push({part:k,qty:1});toast(express?'Part received. Return to your active repair.':'Ordered for tomorrow morning.');render()}
function exportSave(){save();let blob=new Blob([JSON.stringify({format:'second-life-backup',savedAt:new Date().toISOString(),state:S},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='second-life-day-'+S.day+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup exported. Keep it somewhere safe.')}
function validSave(s){if(!s||s.v!==1||!Number.isFinite(s.day)||s.day<1||!Number.isFinite(s.time)||s.time<0||s.time>480||!Number.isFinite(s.cash)||s.cash<0||!Number.isFinite(s.rep)||s.rep<0||s.rep>100||!Number.isFinite(s.xp)||s.xp<0||!Array.isArray(s.orders)||!Array.isArray(s.incoming)||!Array.isArray(s.tools)||!Array.isArray(s.deliveries)||!Array.isArray(s.ledger)||!Array.isArray(s.history)||!s.stock||!s.stats||!s.stories)return false;if(s.tools.some(t=>!TOOLS[t])||Object.keys(PARTS).some(k=>!Number.isFinite(s.stock[k])||s.stock[k]<0))return false;if(!Number.isInteger(s.nextId)||s.nextId<1||['completed','failed','totalEarned','expenses'].some(k=>!Number.isFinite(s[k])||s[k]<0)||Object.entries(s.stories).some(([k,v])=>!PEOPLE[k]||!Number.isInteger(v)||v<0)||['diagnosed','perfect','questions'].some(k=>!Number.isFinite(s.stats[k])||s.stats[k]<0)||s.history.some(h=>typeof h.person!=='string'||typeof h.model!=='string'||typeof h.fault!=='string')||s.ledger.some(l=>typeof l.text!=='string'||!Number.isFinite(l.amount)))return false;return[...s.orders,...s.incoming].every(j=>FAULTS[j.fault]&&PEOPLE[j.person]&&typeof j.model==='string'&&/^[a-zA-Z0-9 -]{1,45}$/.test(j.model)&&Array.isArray(j.dialog)&&Array.isArray(j.screws)&&Array.isArray(j.wires)&&Array.isArray(j.asked)&&Array.isArray(j.logs)&&Array.isArray(j.testsPassed)&&j.tests&&Number.isFinite(j.id)&&Number.isFinite(j.quality)&&(!j.diagnosis||FAULTS[j.diagnosis]))&&s.deliveries.every(d=>PARTS[d.part]&&Number.isFinite(d.qty)&&d.qty>0)}
async function importSave(file){if(!file)return;if(file.size>2000000){toast('Backup is too large.');return}try{let b=JSON.parse(await file.text());if(b.format!=='second-life-backup'||!validSave(b.state))throw Error();window.pendingImport=b.state;modal('Load this workshop?','<p>This backup is from day '+b.state.day+'. It will replace the career in this browser. Export your current career first if you want to keep both.</p>',[{text:'Load backup',action:'confirmImport',primary:true},{text:'Cancel',action:'closeModal'}])}catch{toast('This is not a valid Second Life backup. Your current career is unchanged.')}}
$('#app').addEventListener('click',e=>{let el=e.target.closest('button,[data-component],[data-screw],[data-wire]');if(!el||el.disabled)return;if(el.dataset.view){view=el.dataset.view;render();return}if(el.dataset.tab){tab=el.dataset.tab;render();return}let j=job();if(el.dataset.screw){if(j)repairClick(j,'screw',el.dataset.screw);return}if(el.dataset.component){if(j)repairClick(j,'component',el.dataset.component);return}if(el.dataset.wire){if(j)repairClick(j,'wire',el.dataset.wire);return}action(el.dataset.action,el.dataset)});
$('#app').addEventListener('keydown',e=>{if(['Enter',' '].includes(e.key)&&e.target.matches('[data-component],[data-screw],[data-wire]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
$('#app').addEventListener('change',e=>{if(e.target.id==='diagnosis'){let j=job();if(j&&j.status==='new'){j.diagnosis=e.target.value||null;j.quote=0;render()}}if(e.target.id==='importfile')importSave(e.target.files[0])});
$('#modal').addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(b)action(b.dataset.action,b.dataset)});
function action(a,d={}){let j=job();switch(a){case'accept':accept(Number(d.id));break;case'open':selected=Number(d.id);view='bench';tab='talk';render();break;case'ask':if(j)ask(j,d.question);break;case'test':if(j)test(j,d.test);break;case'quote':if(j)propose(j);break;case'install':if(j)install(j);break;case'assemble':if(j)assemble(j);break;case'qc':if(j)qc(j,d.check);break;case'handover':if(j)handover(j);break;case'reopen':if(j)reopen(j);break;case'confirmReopen':if(j){j.status='new';j.step=0;j.installed=false;j.screws=[];j.wires=[];j.testsPassed=[];j.diagnosis=null;tab='diagnose';addLog(j,'Repair reopened for further investigation.');$('#modal').close();render()}break;case'buy':buy(d.part,d.speed);break;case'upgrade':{let t=TOOLS[d.tool];if(!t||has(d.tool)||level()<t.level||S.cash<t.cost)return;ledger(t.name,-t.cost);S.tools.push(d.tool);toast('Installed: '+t.name);render();break}case'quick':if(spend(30)){let n=S.day%4===0?24:18;ledger('Quick service counter',n);toast('Quick service complete · '+money(n));render()}break;case'endday':endDay();break;case'confirmDay':nextDay();break;case'decline':decline();break;case'confirmDecline':if(j){S.rep=Math.max(0,S.rep-(j.status==='new'?1:4));S.failed++;S.history.unshift({day:S.day,person:PEOPLE[j.person].name,model:j.model,fault:'Returned without repair',quality:j.quality,ok:false});S.orders=S.orders.filter(o=>o.id!==j.id);selected=null;view='orders';$('#modal').close();render()}break;case'closeModal':$('#modal').close();break;case'export':exportSave();break;case'import':$('#importfile').click();break;case'confirmImport':if(window.pendingImport&&validSave(window.pendingImport)){S=window.pendingImport;delete window.pendingImport;selected=null;view='desk';$('#modal').close();render();toast('Workshop restored.')}break;case'reset':modal('Start a new career?','<p>Your current workshop will be replaced. Export a backup first if you want to keep it.</p>',[{text:'Start new career',action:'confirmReset'},{text:'Keep my workshop',action:'closeModal',primary:true}]);break;case'confirmReset':S=fresh();generate();selected=null;view='desk';$('#modal').close();render();break}}
addEventListener('pagehide',save);render();
})();
</script></body></html>
